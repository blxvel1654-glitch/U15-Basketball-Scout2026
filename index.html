<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U15 AI改善分析</title>
<style>
body{font-family:system-ui,sans-serif;background:#f2f5f9;color:#182230;margin:0;padding:16px}main{max-width:980px;margin:auto}
h1{font-size:22px}.card{background:white;border:1px solid #d9e1eb;border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
label{font-size:13px;color:#475569}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;background:#2463a6;color:white;font-weight:bold}
.rec{border:1px solid #ddd;border-left:5px solid #b45b10;border-radius:8px;padding:10px;margin:8px 0}.bad{border-left-color:#b42318}
small,.hint{color:#64748b}.player{border-top:1px solid #ddd;padding:10px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<h1>🏀 U15 チーム診断・個人改善提案</h1>
<p class="hint">入力された試合スタッツを数値化し、暫定強化基準との差と練習課題を表示します。全国公式平均ではありません。</p>
<div class="card"><h2>チームスタッツ</h2><div class="grid" id="team"></div></div>
<div class="card"><h2>選手別データ</h2><p class="hint">選手ごとに入力。2P/3P/FTは成功数と試投数、REB/AST/TOを記録。</p><div id="players"></div><button onclick="addPlayer()">選手を追加</button></div>
<button onclick="analyze()">AI診断を作成</button>
<div class="card"><h2>チーム診断</h2><div id="diagnosis">データ入力後に診断します。</div></div>
<div class="card"><h2>練習提案</h2><div id="training"></div></div>
<div class="card"><h2>個人別修正案</h2><div id="individual"></div></div>
<div class="card"><h2>次戦の数値目標</h2><div id="goals"></div></div>
</main><script>
const teamFields=[["PTS","得点"],["2PM","2P成功"],["2PA","2P試投"],["3PM","3P成功"],["3PA","3P試投"],["FTM","FT成功"],["FTA","FT試投"],["REB","リバウンド"],["OREB","OREB"],["DREB","DREB"],["AST","アシスト"],["TO","ターンオーバー"]];
const team=document.getElementById('team');
teamFields.forEach(([k,n])=>team.innerHTML+=`<label>${n}<input type="number" min="0" id="t_${k}" value="0"></label>`);
let count=0;
function addPlayer(){count++;let d=document.createElement('div');d.className='player';d.innerHTML=`<b>選手 ${count}</b><div class="grid">
${[['name','背番号・名前'],['p2m','2P成功'],['p2a','2P試投'],['p3m','3P成功'],['p3a','3P試投'],['ftm','FT成功'],['fta','FT試投'],['reb','REB'],['ast','AST'],['to','TO']].map(([k,n])=>`<label>${n}<input data-k="${k}" type="${k==='name'?'text':'number'}" min="0" value="${k==='name'?'':'0'}"></label>`).join('')}
</div>`;document.getElementById('players').appendChild(d)}
addPlayer();
const val=id=>Number(document.getElementById('t_'+id)?.value||0);
const pct=(m,a)=>a?m/a*100:null, fmt=x=>x===null?'未記録':x.toFixed(1)+'%';
function analyze(){
let t=Object.fromEntries(teamFields.map(([k])=>[k,val(k)]));
let two=pct(t['2PM'],t['2PA']),three=pct(t['3PM'],t['3PA']),ft=pct(t.FTM,t.FTA);
let checks=[['2P成功率',fmt(two),'40%以上',two!==null&&two>=40],['3P成功率',fmt(three),'25%以上',three!==null&&three>=25],['FT成功率',fmt(ft),'60%以上',ft!==null&&ft>=60],['REB',t.REB+'本','50本以上',t.REB>=50],['AST',t.AST+'本','8本以上',t.AST>=8],['TO',t.TO+'回','10回以下',t.TO<=10]];
document.getElementById('diagnosis').innerHTML=checks.map(([n,v,g,ok])=>`<div class="rec ${ok?'':'bad'}"><b>${ok?'基準達成':'要改善'}：${n}</b><p>現在 ${v} / 暫定目標 ${g}</p></div>`).join('');
let drills=[];
if(two===null||two<40)drills.push('2P：左右レイアップ各10本×2、コンタクトありフィニッシュ左右各8本。3対3でペイント侵入後のフィニッシュ判断も反復。');
if(three===null||three<25)drills.push('3P：45度・トップ・コーナーから各10本。足の準備、パスの質、リリースの再現性を記録。');
if(ft===null||ft<60)drills.push('FT：個人20〜30本を複数セット。連続成功数を記録し、最後は練習後半の疲労状態で測定。');
if(t.TO>10||t.AST<8)drills.push('判断・パス：3対3でキャッチ前にリング・味方・DFを確認。ドライブ後のフィニッシュ／キックアウト／リセットを判断し、TO原因を分類。');
if(t.REB<50)drills.push('リバウンド：2対2・3対3で相手を見つけて接触し、ボックスアウトしてから確保。OREB/DREBを別々に記録。');
document.getElementById('training').innerHTML=drills.map((x,i)=>`<div class="rec bad">${i+1}. ${x}</div>`).join('')||'基準達成。成功したプレーを映像で抽出し再現練習。';
let out=[];
document.querySelectorAll('.player').forEach((el,i)=>{let x={};el.querySelectorAll('input').forEach(a=>x[a.dataset.k]=a.type==='number'?Number(a.value||0):a.value);let notes=[];
let p2=pct(x.p2m,x.p2a),p3=pct(x.p3m,x.p3a),pft=pct(x.ftm,x.fta);
if(x.p2a>=5&&p2<40)notes.push(`2P ${fmt(p2)}。左右のフィニッシュとコンタクト後の体勢を修正。`);
if(x.p3a>=5&&p3<25)notes.push(`3P ${fmt(p3)}。足の準備・リリース位置・シュート状況を確認。`);
if(x.fta>=3&&pft<60)notes.push(`FT ${fmt(pft)}。ルーティンとフォロースルーを固定。`);
if(x.to>=3)notes.push(`TO ${x.to}回。プレッシャー下のボール保持とパス判断を重点練習。`);
if(x.ast===0&&((x.p2m*2+x.p3m*3+x.ftm)>0))notes.push('得点はあるがASTなし。ヘルプを引きつけた後のパス判断を練習。');
if(x.reb>=5)notes.push(`REB ${x.reb}本は強み。ボックスアウトとリバウンド後の展開まで役割を広げる。`);
if(notes.length)out.push(`<div class="rec ${x.to>=3?'bad':''}"><b>${x.name||'選手'+(i+1)}</b><p>${notes.join('<br>')}</p></div>`);
});
document.getElementById('individual').innerHTML=out.join('')||'入力データから抽出できる個人課題はありません。';
document.getElementById('goals').innerHTML=`得点65点以上 / 2P 40%以上 / 3P 25%以上 / FT 60%以上 / REB 50本以上 / AST 8本以上 / TO 10回以下`;
}
</script></body></html>
