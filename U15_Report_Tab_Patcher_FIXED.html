<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>U15 評価レポートタブ 修正版</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.65;color:#172033}.card{border:1px solid #d7deea;border-radius:14px;padding:18px;margin:16px 0}button{background:#1769aa;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700}input{max-width:100%}.small{font-size:13px;color:#526174}</style>
</head><body>
<h1>U15 評価レポートタブ追加ツール（修正版）</h1>
<div class="card"><p><b>動画分析の中に「動画分析」「評価レポート」の2つのタブを追加します。</b></p>
<ol><li>GitHubから現在の index.html をダウンロード</li><li>下でそのファイルを選択</li><li>「更新版を作成」を押す</li><li>生成された index.html をGitHubのリポジトリの一番上にアップロードし、既存ファイルを置き換える</li></ol>
<p class="small">元のファイルは必ずバックアップしてください。ZIPをGitHubに置くだけではアプリは更新されません。</p></div>
<div class="card"><label><b>現在の index.html</b><br><input id="file" type="file" accept=".html,text/html"></label><br><br><button id="go">更新版を作成</button><p id="status" class="small"></p></div>
<script>
const injected = "<style id=\"u15-report-tab-style\">\n.u15-report-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}\n.u15-report-tab{border:1px solid #9aa9bb;background:#f2f5f9;color:#1d2939;padding:10px 16px;border-radius:999px;font-weight:700;cursor:pointer}\n.u15-report-tab.active{background:#155eef;color:#fff;border-color:#155eef}\n.u15-report-panel{border:1px solid #d0d5dd;border-radius:14px;padding:14px;margin:10px 0;background:#fff;color:#172033}\n.u15-report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}\n.u15-report-field{display:flex;flex-direction:column;gap:4px;margin:8px 0}\n.u15-report-field input,.u15-report-field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #98a2b3;border-radius:8px}\n.u15-report-card{border:1px solid #d0d5dd;border-radius:12px;padding:12px;margin:10px 0}\n.u15-report-card img{max-width:100%;height:auto;max-height:280px;object-fit:contain;border-radius:8px}\n.u15-report-muted{font-size:12px;opacity:.75}\n.u15-report-action{background:#155eef;color:#fff;border:0;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer;margin:4px}\n@media print{body.u15-print-report *{visibility:hidden!important}body.u15-print-report #u15ReportPrint,body.u15-print-report #u15ReportPrint *{visibility:visible!important}body.u15-print-report #u15ReportPrint{position:absolute;left:0;top:0;width:100%;color:#111;background:#fff}.u15-report-action{display:none!important}}\n<\/style>\n<script id=\"u15-report-tab-script\">\n(function(){\n function init(){\n  var section=document.getElementById('videoAnalysis');\n  if(!section){console.warn('U15: videoAnalysis section not found');return;}\n  if(section.querySelector('.u15-report-tabs'))return;\n  var original=Array.prototype.slice.call(section.children);\n  var nav=document.createElement('div');nav.className='u15-report-tabs';\n  var a=document.createElement('button');a.type='button';a.className='u15-report-tab active';a.textContent='動画分析';\n  var b=document.createElement('button');b.type='button';b.className='u15-report-tab';b.textContent='評価レポート';\n  nav.appendChild(a);nav.appendChild(b);\n  var panel=document.createElement('div');panel.id='u15ReportPanel';panel.className='u15-report-panel';panel.hidden=true;\n  panel.innerHTML='<h3>選手別 評価レポート<\/h3><p class=\"u15-report-muted\">保存した選手別レポートを確認できます。角度の数値は入力値です。映像と照合してコーチが最終確認してください。<\/p>'+\n   '<div class=\"u15-report-grid\">'+\n   '<label class=\"u15-report-field\">選手名<input id=\"u15ReportPlayer\" placeholder=\"例：#7 山田\"><\/label>'+\n   '<label class=\"u15-report-field\">シュート成功率（%）<input id=\"u15ReportPct\" type=\"number\" min=\"0\" max=\"100\" step=\"0.1\"><\/label>'+\n   '<label class=\"u15-report-field\">肩・肘・手首・膝・体幹の所見<input id=\"u15ReportJoint\" placeholder=\"例：肘の伸展、体幹の傾き\"><\/label>'+\n   '<label class=\"u15-report-field\">リリース画像<input id=\"u15ReportImage\" type=\"file\" accept=\"image/*\"><\/label><\/div>'+\n   '<div class=\"u15-report-grid\"><label class=\"u15-report-field\">良かった点<textarea id=\"u15ReportGood\" rows=\"3\"><\/textarea><\/label>'+\n   '<label class=\"u15-report-field\">改善点<textarea id=\"u15ReportImprove\" rows=\"3\"><\/textarea><\/label><\/div>'+\n   '<label class=\"u15-report-field\">前回との比較・コーチ所見<textarea id=\"u15ReportCompare\" rows=\"3\"><\/textarea><\/label>'+\n   '<button type=\"button\" class=\"u15-report-action\" id=\"u15ReportSave\">レポートを保存<\/button>'+\n   '<button type=\"button\" class=\"u15-report-action\" id=\"u15ReportPdf\">PDF保存・印刷<\/button>'+\n   '<div id=\"u15ReportPrint\"><h3>保存済みレポート<\/h3><div id=\"u15ReportList\"><\/div><\/div>';\n  section.insertBefore(nav,section.firstChild);section.appendChild(panel);\n  function show(report){\n   original.forEach(function(el){if(el!==nav&&el!==panel)el.hidden=report;});\n   panel.hidden=!report;a.classList.toggle('active',!report);b.classList.toggle('active',report);\n   if(report)render();\n  }\n  a.addEventListener('click',function(){show(false);});b.addEventListener('click',function(){show(true);});\n  var key='u15_release_reports_v1';\n  function load(){try{var v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}\n  function esc(s){return String(s==null?'':s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c];});}\n  function render(){\n   var list=document.getElementById('u15ReportList'),items=load().slice().reverse();\n   if(!items.length){list.innerHTML='<p>まだ保存されたレポートはありません。上の欄に入力して保存してください。<\/p>';return;}\n   list.innerHTML=items.map(function(r){return '<article class=\"u15-report-card\"><b>'+esc(r.player||r.playerName||'選手未設定')+'<\/b><div class=\"u15-report-muted\">'+esc(r.date||r.createdAt||'')+'<\/div>'+\n    ((r.image||r.releaseImage||r.skeletonImage)?'<img src=\"'+(r.image||r.releaseImage||r.skeletonImage)+'\" alt=\"リリース画像\">':'')+\n    '<p>成功率：'+esc(r.pct||r.successRate||'未入力')+'%<\/p><p>関節所見：'+esc(r.joint||'未入力')+'<\/p>'+\n    '<p><b>良かった点：<\/b>'+esc(r.good||r.positive||'未記入')+'<\/p><p><b>改善点：<\/b>'+esc(r.improve||r.improvement||'未記入')+'<\/p><p><b>比較・所見：<\/b>'+esc(r.compare||'未記入')+'<\/p><\/article>';}).join('');\n  }\n  document.getElementById('u15ReportSave').addEventListener('click',function(){\n   var player=document.getElementById('u15ReportPlayer').value.trim();if(!player){alert('選手名を入力してください');return;}\n   var r={player:player,pct:document.getElementById('u15ReportPct').value,joint:document.getElementById('u15ReportJoint').value,good:document.getElementById('u15ReportGood').value,improve:document.getElementById('u15ReportImprove').value,compare:document.getElementById('u15ReportCompare').value,date:new Date().toLocaleString('ja-JP')};\n   var file=document.getElementById('u15ReportImage').files[0];\n   function done(img){if(img)r.image=img;var arr=load();arr.push(r);localStorage.setItem(key,JSON.stringify(arr));render();alert('レポートを保存しました');}\n   if(file){var fr=new FileReader();fr.onload=function(){done(fr.result);};fr.readAsDataURL(file);}else done('');\n  });\n  document.getElementById('u15ReportPdf').addEventListener('click',function(){document.body.classList.add('u15-print-report');window.print();document.body.classList.remove('u15-print-report');});\n  render();\n }\n if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();\n})();\n<\/script>";
document.getElementById('go').addEventListener('click',async function(){
 const f=document.getElementById('file').files[0],s=document.getElementById('status');
 if(!f){s.textContent='index.htmlを選択してください。';return;}
 try{
  let html=await f.text();
  if(!/id\\s*=\\s*["']videoAnalysis["']/.test(html)){s.textContent='videoAnalysis セクションが見つかりません。現在公開中のアプリの index.html を選んでください。';return;}
  if(html.includes('u15-report-tab-script')){s.textContent='このファイルには評価レポートタブ追加コードがすでに入っています。';return;}
  const pos=html.toLowerCase().lastIndexOf('</body>');
  if(pos<0){s.textContent='HTMLの </body> が見つかりません。';return;}
  html=html.slice(0,pos)+injected+'\\n'+html.slice(pos);
  const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='index.html';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  s.textContent='更新版 index.html を作成しました。これをGitHubのリポジトリ直下にアップロードしてください。';
 }catch(e){s.textContent='エラー：'+e.message;}
});
</script></body></html>
